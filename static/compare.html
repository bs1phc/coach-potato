<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare</title>
<link rel="stylesheet" href="style.css">
<style>
  /* standalone comparison window — reuses .cmp-* from style.css */
  body { max-width: none; padding: 18px; }
  .cmp-title { font-size: 18px; margin: 0 0 4px; }
  .cmp-sub { margin: 0 0 12px; }
  .cmp-note { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .cmp-controls { margin: 0 0 14px; display: flex; align-items: center; gap: 14px; }
  .cmp-patch-label { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  #patch-filter { padding: 4px 8px; }
  .cmp-toggle {
    font: inherit; font-size: 12px; cursor: pointer; padding: 5px 12px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary);
  }
  .cmp-toggle[aria-pressed="true"] { border-color: var(--series-1); color: var(--series-1); }

  /* Recent games: one aligned grid line per game with a header row on top, so
     KDA · Skill · Spells · Runes · Start · Build read as labelled columns. */
  .cmp-recent { margin-top: 6px; }
  .cmp-ghead, .cmp-game {
    display: grid; align-items: center; justify-items: start; gap: 7px;
    grid-template-columns: 14px 40px 34px 1fr;
  }
  .cmp-recent.loadout .cmp-ghead,
  .cmp-recent.loadout .cmp-game {
    /* runes sized to content; Build fills the rest and left-aligns (justify-items:
       start) so builds start right after runes with the blank on the right */
    grid-template-columns: 16px 42px 34px 46px 40px minmax(120px, max-content) minmax(0, 1fr);
  }
  .cmp-lane { display: inline-flex; gap: 2px; }
  .cmp-legend { font-size: 11px; color: var(--muted); margin: -8px 0 14px; line-height: 1.9; }
  .cmp-legend .lane-pill { margin-right: 1px; }
  .cmp-ghead {
    font-size: 8.5px; text-transform: uppercase; letter-spacing: .03em;
    color: var(--muted); padding-bottom: 3px; margin-bottom: 2px;
    border-bottom: 1px solid var(--grid);
  }
  .cmp-ghead span { overflow: hidden; text-overflow: ellipsis; }
  .cmp-game { padding: 3px 0; min-height: 22px; }
  .cmp-game + .cmp-game { border-top: 1px solid rgba(128,128,128,.09); }
  .cmp-res { font-weight: 700; font-size: 12px; }
  .cmp-res.w { color: var(--good); }
  .cmp-res.l { color: var(--critical); }
  .cmp-kda { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-secondary); }
  .cmp-skill { font-size: 11px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; letter-spacing: .5px; }
  .cmp-runes { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; overflow: hidden; }
  .cmp-runes .sep { width: 4px; flex: none; }
  .cmp-spells, .cmp-start, .cmp-build { display: inline-flex; gap: 2px; }
  .cmp-item-empty {
    width: 16px; height: 16px; border-radius: 3px; display: inline-block;
    background: rgba(128,128,128,.13);
  }
  .cmp-card img { vertical-align: middle; }
</style>
</head>
<body class="cmp-doc">
<h1 class="cmp-title" id="title">Comparison</h1>
<p class="cmp-sub muted" id="subtitle"></p>
<div class="cmp-controls">
  <button type="button" id="loadout-toggle" class="cmp-toggle" aria-pressed="false">Show spells &amp; items</button>
  <label class="cmp-patch-label">Patch
    <select id="patch-filter" class="cmp-toggle"><option value="">All</option></select>
  </label>
  <label class="cmp-patch-label">Lane
    <select id="lane-grade" class="cmp-toggle">
      <option value="relative">vs matchup</option>
      <option value="absolute">raw lead</option>
    </select>
  </label>
  <label class="cmp-patch-label">by
    <select id="lane-method" class="cmp-toggle"></select>
  </label>
</div>
<div class="cmp-legend" id="lane-legend"></div>
<div class="cmp-cards" id="cards"><p class="muted">Loading…</p></div>
<p class="cmp-note">Runes (with shards) are what each player actually ran in recent games.
  Toggle "Show spells &amp; items" to also reveal the ability max order (Skill),
  summoner spells, and the full Build in purchase order (from the timeline; ward
  trinkets and consumables omitted).</p>
<script>
const P = new URLSearchParams(location.search);
const my = P.get("my") || "", opp = P.get("opp") || "";
document.getElementById("title").textContent = `${opp} matchup — other players`;
document.getElementById("subtitle").textContent = `Playing ${my} into ${opp}`;
document.title = `Compare · ${my} vs ${opp}`;

// name -> icon maps, built from the same runes.json the guide uses
const treeIcon = {}, runeIconMap = {}, shardIconMap = {};
async function loadRunes() {
  try {
    const d = await (await fetch("runes.json")).json();
    (d.trees || []).forEach((t) => {
      treeIcon[t.name] = t.icon;
      (t.rows || []).forEach((row) =>
        (row.runes || []).forEach((r) => { runeIconMap[r.name] = r.icon; }));
    });
    (d.shardRows || []).forEach((row) =>
      (row.shards || []).forEach((s) => { shardIconMap[s.name] = s.icon; }));
  } catch (e) { /* icons just won't render; stats still do */ }
}
const ddImg = (i) => (i ? `https://ddragon.leagueoflegends.com/cdn/img/${i}` : "");
const shardImgUrl = (i) => (i ? "https://raw.communitydragon.org/latest/plugins/"
  + `rcp-be-lol-game-data/global/default/v1/perk-images/statmods/${i}` : "");

// DDragon version + summoner-spell icons, for the spells + items shown per
// game. Item icons are just <id>.png under the current version — no extra
// data file needed; spells need summoner.json to map id -> icon filename.
let ddVer = "";
const spellIcon = {}; // numeric spell id -> image filename
async function loadDdragon() {
  try {
    const v = await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json();
    ddVer = v[0] || "";
  } catch (e) { return; }
  try {
    const d = await (await fetch(
      `https://ddragon.leagueoflegends.com/cdn/${ddVer}/data/en_US/summoner.json`)).json();
    Object.values(d.data || {}).forEach((s) => { spellIcon[s.key] = s.image.full; });
  } catch (e) { /* spell icons just won't render */ }
}
const spellUrl = (id) => (ddVer && spellIcon[id]
  ? `https://ddragon.leagueoflegends.com/cdn/${ddVer}/img/spell/${spellIcon[id]}` : "");
const itemUrl = (id) => (ddVer && id
  ? `https://ddragon.leagueoflegends.com/cdn/${ddVer}/img/item/${id}.png` : "");
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function img(url, size, title) {
  return url ? `<img src="${url}" width="${size}" height="${size}" title="${esc(title)}"
    style="border-radius:50%;vertical-align:middle">` : "";
}
// runes in one cell (compact so the whole game fits on one line): keystone +
// primary minors | secondary tree + minors | shards
function runeStrip(page) {
  if (!page) return `<span class="cmp-runes"><span class="muted" style="font-size:10px">—</span></span>`;
  const ks = img(ddImg(runeIconMap[page.keystone]), 20, page.keystone);
  const minors = (page.primary_runes || []).filter(Boolean)
    .map((n) => img(ddImg(runeIconMap[n]), 12, n)).join("");
  const sec = img(ddImg(treeIcon[page.secondary_tree]), 15, page.secondary_tree);
  const secMinors = (page.secondary_runes || []).filter(Boolean)
    .map((n) => img(ddImg(runeIconMap[n]), 12, n)).join("");
  const shards = (page.shards || []).filter(Boolean)
    .map((n) => img(shardImgUrl(shardIconMap[n]), 10, n)).join("");
  return `<span class="cmp-runes">${ks}${minors}<span class="sep"></span>${sec}${secMinors}`
    + `${shards ? `<span class="sep"></span>${shards}` : ""}</span>`;
}
// ability max order Q > W > E, from g.skill_order (slots 1/2/3)
const SKILL_LETTER = { 1: "Q", 2: "W", 3: "E" };
function skillOrder(g) {
  const order = (g.skill_order || []).map((s) => SKILL_LETTER[s]).filter(Boolean);
  return `<span class="cmp-skill" title="Ability max order">${order.length ? order.join("›") : "—"}</span>`;
}
// square item icon (not round like spells/runes)
function itemImg(url, size, title) {
  return url ? `<img src="${url}" width="${size}" height="${size}" title="${esc(title)}"
    style="border-radius:3px;vertical-align:middle">` : "";
}
// always render 2 spell slots so the column aligns even when a game has none
function spellStrip(g) {
  const cells = [g.spell1, g.spell2].map((id) => {
    const u = spellUrl(id);
    return u ? img(u, 18, "Summoner spell") : `<span class="cmp-item-empty" style="border-radius:50%;width:18px;height:18px"></span>`;
  });
  return `<span class="cmp-spells">${cells.join("")}</span>`;
}
// ward trinkets are bought at start too but are noise for "what did they open
// with", so drop them from the Start group
const TRINKETS = new Set([3340, 3363, 3364]);
function itemSlots(ids, n, size, title) {
  return [...Array(n)].map((_, i) => {
    const u = itemUrl(ids[i]);
    return u ? itemImg(u, size, title)
      : `<span class="cmp-item-empty" style="width:${size}px;height:${size}px"></span>`;
  }).join("");
}
// consumables/pots/wards that linger in the final inventory but aren't "build"
const CONSUMABLES = new Set([2003, 2010, 2022, 2031, 2033, 2055, 2138, 2139, 2140, 2150, 2151, 2152]);
// Full build in purchase order. build_order (from the timeline) excludes the
// game-start buy, so prepend the opener(s) — final items not already in
// build_order (bought at start) — to show the whole build including Doran's.
function buildSlots(g) {
  const skip = (id) => !id || TRINKETS.has(id) || CONSUMABLES.has(id);
  const bo = (g.build_order || []).filter((id) => !skip(id));
  const final = (g.items || []).filter((id) => !skip(id));
  const openers = final.filter((id) => !bo.includes(id)); // opener(s): bought first, not in build_order
  const full = [...openers, ...bo];
  if (!full.length) return itemSlots([], 3, 18, "Build");
  return full.map((id) => itemImg(itemUrl(id), 18, "Build")).join("");
}

const pct = (v) => (v == null ? "—" : Math.round(v * 100) + "%");
const num = (v, d = 1) => (v == null ? "—" : (+v).toFixed(d));
const kda = (s) => (s.games ? `${num(s.kills)}/${num(s.deaths)}/${num(s.assists)}` : "—");
function statRow(label, val) {
  return `<div class="cmp-stat"><span class="cmp-stat-l">${label}</span><span>${val}</span></div>`;
}
function aggLine(s) {
  return s.games
    ? `${s.games} games · ${pct(s.winrate)} · ${kda(s)} · ${num(s.cs_min)} CS/min`
    : "no games recorded";
}
// Laning-phase block: does this player win lane in the matchup? Shows how often
// they're ahead at 7/14 min (lane_adv_*), the ΔCS/ΔGold vs the lane opponent,
// and CS@10 · solo kills · plates. All from the aggregated matchup metrics.
const sgn = (v, d = 0) => (v == null ? "—" : (v > 0 ? "+" : "") + (+v).toFixed(d));

// --- Lane-win verdict (kept in sync with app.js; this popup is standalone) ---
const LANE_METHODS = [
  { key: "combined", label: "Gold + XP" },
  { key: "gold", label: "Gold" },
  { key: "cs", label: "CS" },
  { key: "xp", label: "XP / level" },
];
const LANE_THRESHOLDS = {
  gold:     { 7: { won: 250, stomp: 700 }, 14: { won: 500, stomp: 1200 } },
  combined: { 7: { won: 250, stomp: 700 }, 14: { won: 500, stomp: 1200 } },
  cs:       { 7: { won: 12,  stomp: 25 },  14: { won: 18,  stomp: 40 } },
  xp:       { 7: { won: 150, stomp: 450 }, 14: { won: 300, stomp: 800 } }, // raw XP
};
const LANE_LEVEL_THRESHOLDS = { 7: { won: 1, stomp: 2 }, 14: { won: 1, stomp: 2 } };
const LANE_TIERS = {
  stomp:   { symbol: "⇈", cls: "lane-stomp" },
  won:     { symbol: "✓", cls: "lane-won" },
  even:    { symbol: "=", cls: "lane-even" },
  lost:    { symbol: "✗", cls: "lane-lost" },
  stomped: { symbol: "⇊", cls: "lane-stomped" },
};
const LANE_TIER_LABELS = {
  absolute: { stomp: "Stomp", won: "Won", even: "Even", lost: "Lost", stomped: "Stomped" },
  relative: { stomp: "Crushed", won: "Ahead of curve", even: "On plan",
              lost: "Behind curve", stomped: "Well behind" },
};
// this matchup's expected deltas (goal overrides the data baseline), set from
// the comparison payload; used only in relative grade mode.
let LANE_BASELINE = null, LANE_GOAL = null;
function laneWinMethod() {
  const m = localStorage.getItem("cp-lane-metric");
  return LANE_THRESHOLDS[m] ? m : "combined";
}
function laneGradeMode() {
  return localStorage.getItem("cp-lane-grade") === "absolute" ? "absolute" : "relative";
}
function laneExpected(metricBase, mark) {
  if (LANE_GOAL && LANE_GOAL[`${metricBase}_${mark}`] != null) return LANE_GOAL[`${metricBase}_${mark}`];
  const bv = LANE_BASELINE && LANE_BASELINE[`${metricBase}_diff_${mark}`];
  return bv != null ? bv : 0;
}
function laneOutcome(g, mark, method = laneWinMethod(), mode = laneGradeMode()) {
  let t = LANE_THRESHOLDS[method][mark];
  const gold = g[`gold_diff_${mark}`], cs = g[`cs_diff_${mark}`];
  const xp = g[`xp_diff_${mark}`], lvl = g[`level_diff_${mark}`];
  let value, unit, metricBase = method === "cs" ? "cs" : method === "xp" ? "xp" : "gold";
  if (method === "cs") { value = cs; unit = "CS"; }
  else if (method === "xp") {
    if (xp != null) { value = xp; unit = "XP"; }
    else { value = lvl; unit = "lvl"; t = LANE_LEVEL_THRESHOLDS[mark]; }
  } else { value = gold; unit = "g"; }
  if (value == null) return null;
  const relative = mode === "relative" && !(method === "xp" && xp == null);
  const expected = relative ? laneExpected(metricBase, mark) : 0;
  const residual = value - expected;
  const mag = Math.abs(residual);
  let name = mag >= t.stomp ? "stomp" : mag >= t.won ? "won" : "even";
  if (name !== "even" && residual < 0) name = name === "stomp" ? "stomped" : "lost";
  if (method === "combined" && name !== "even") {
    const agree = xp != null ? xp : lvl;
    if (agree != null && Math.sign(agree) !== 0 && Math.sign(agree) !== Math.sign(residual)) name = "even";
  }
  return { tier: name, value, unit, expected,
           symbol: LANE_TIERS[name].symbol, cls: LANE_TIERS[name].cls,
           label: LANE_TIER_LABELS[relative ? "relative" : "absolute"][name] };
}
function laneVerdictPill(g, mark) {
  const o = laneOutcome(g, mark);
  if (!o) return `<span class="lane-pill lane-even" title="No lane data @${mark}m">–</span>`;
  const fmt = (v) => (o.unit === "CS" ? v.toFixed(1) : Math.round(v));
  const sg = (v) => (v > 0 ? "+" : "");
  const exp = o.expected ? ` (matchup usually ${sg(o.expected)}${fmt(o.expected)})` : "";
  return `<span class="lane-pill ${o.cls}" title="${o.label} @${mark}m · ${sg(o.value)}${fmt(o.value)} ${o.unit}${exp}">${o.symbol}</span>`;
}
// Won/lost record across a set of games at a mark, using the current method.
function laneRecord(games, mark) {
  let won = 0, lost = 0, even = 0, n = 0;
  for (const g of games) {
    const o = laneOutcome(g, mark);
    if (!o) continue;
    n++;
    if (o.tier === "won" || o.tier === "stomp") won++;
    else if (o.tier === "lost" || o.tier === "stomped") lost++;
    else even++;
  }
  if (!n) return "<span class='muted'>no timeline data</span>";
  return `${won}W-${lost}L${even ? `-${even}E` : ""} (${Math.round(100 * won / n)}%)`;
}
function renderLaneLegend() {
  const method = laneWinMethod(), mode = laneGradeMode();
  const u = method === "cs" ? " CS" : method === "xp" ? " XP" : "g";
  const t7 = LANE_THRESHOLDS[method][7], t14 = LANE_THRESHOLDS[method][14];
  const lbl = LANE_TIER_LABELS[mode];
  const chip = (k) => `<span class="lane-pill ${LANE_TIERS[k].cls}">${LANE_TIERS[k].symbol}</span> ${lbl[k]}`;
  const basis = mode === "relative"
    ? "<strong>Winning lane</strong> = beating what this matchup usually produces (your goal, else the data baseline)."
    : "<strong>Winning lane</strong> = ahead vs your direct lane opponent (a raw lead).";
  document.getElementById("lane-legend").innerHTML =
    `${basis} `
    + `${chip("won")} ≥ ${t7.won}${u} @7 / ${t14.won}${u} @14 · `
    + `${chip("stomp")} ≥ ${t7.stomp}${u} / ${t14.stomp}${u} · ${chip("even")} in between · `
    + `${chip("lost")} / ${chip("stomped")} the same behind`
    + (mode === "relative" && LANE_BASELINE ? ` · this matchup: ${LANE_BASELINE.games} games sampled` : "")
    + (method === "combined" ? " · a gold lead only counts if XP agrees." : ".");
}

function laneDelta(m, min) {
  const cs = m[`cs_diff_${min}`], xp = m[`xp_diff_${min}`], gold = m[`gold_diff_${min}`];
  if (cs == null && gold == null && xp == null) return "<span class='muted'>—</span>";
  return `ΔCS ${sgn(cs, 1)} · ΔXP ${sgn(xp)} · ΔGold ${sgn(gold)}`;
}
function laningBlock(s, games) {
  const m = s.metrics || {};
  if (!s.games) return statRow("Laning", "—");
  const extras = [];
  if (m.cs_at_10 != null) extras.push(`CS@10 ${(+m.cs_at_10).toFixed(0)}`);
  if (m.solo_kills != null) extras.push(`Solo ${(+m.solo_kills).toFixed(1)}`);
  if (m.plates != null) extras.push(`Plates ${(+m.plates).toFixed(1)}`);
  return statRow("Wins lane @7", laneRecord(games, 7))
    + statRow("Wins lane @14", laneRecord(games, 14))
    + statRow("Lane Δ @7m", laneDelta(m, 7))
    + statRow("Lane Δ @14m", laneDelta(m, 14))
    + (extras.length ? statRow("Laning", extras.join(" · ")) : "");
}
let showLoadout = localStorage.getItem("cmp-loadout") === "1";
let CMP_PLAYERS = [];
let patchFilter = ""; // "" = all; else a major.minor patch like "14.13"

// major.minor patch from a game_version like "14.13.596.7996"
const patchOf = (g) => (g.game_version || "").split(".").slice(0, 2).join(".");
const gamesFor = (p) => (p.recent || []).filter((g) => !patchFilter || patchOf(g) === patchFilter);

function headRow() {
  const cols = showLoadout
    ? ["", "KDA", "Lane", "Skill", "Spells", "Runes", "Build"]
    : ["", "KDA", "Lane", "Runes"];
  return `<div class="cmp-ghead">${cols.map((c) => `<span>${c}</span>`).join("")}</div>`;
}
function laneVerdictCell(g) {
  return `<span class="cmp-lane" title="Lane @7m / @14m vs opponent">`
    + `${laneVerdictPill(g, 7)}${laneVerdictPill(g, 14)}</span>`;
}
function gameRow(g) {
  const kdaTxt = `${num(g.kills, 0)}/${num(g.deaths, 0)}/${num(g.assists, 0)}`;
  const cells = [
    `<span class="cmp-res ${g.win ? "w" : "l"}">${g.win ? "W" : "L"}</span>`,
    `<span class="cmp-kda">${kdaTxt}</span>`,
    laneVerdictCell(g),
  ];
  if (showLoadout) {
    cells.push(skillOrder(g), spellStrip(g), runeStrip(g.runes),
               `<span class="cmp-build">${buildSlots(g)}</span>`);
  } else {
    cells.push(runeStrip(g.runes));
  }
  return `<div class="cmp-game">${cells.join("")}</div>`;
}
function card(p) {
  const games = gamesFor(p);
  const recent = games.length
    ? `<div class="cmp-recent ${showLoadout ? "loadout" : ""}">${headRow()}`
      + `${games.slice(0, 10).map(gameRow).join("")}</div>`
    : (p.recent || []).length
      ? `<p class='muted'>No games on patch ${esc(patchFilter)}.</p>`
      : "<p class='muted'>No recent games — use \"Fetch more\" in Settings.</p>";
  return `<div class="cmp-card">
    <h2>${esc(p.game_name)}<span class="muted">#${esc(p.tag_line)}</span></h2>
    ${statRow(`This matchup vs ${esc(opp)}`, aggLine(p.matchup))}
    ${laningBlock(p.matchup, games)}
    ${statRow(`Overall on ${esc(my)}`, aggLine(p.overall))}
    <h3>Recent games</h3>${recent}
  </div>`;
}
function renderCards() {
  document.getElementById("cards").innerHTML = CMP_PLAYERS.length
    ? CMP_PLAYERS.map(card).join("")
    : "<p class='muted'>No enabled comparison players — add them in "
      + "Settings → Research &amp; comparison.</p>";
}
function syncToggle() {
  const btn = document.getElementById("loadout-toggle");
  btn.setAttribute("aria-pressed", showLoadout ? "true" : "false");
  btn.textContent = showLoadout ? "Hide spells & items" : "Show spells & items";
}

(async function () {
  document.getElementById("loadout-toggle").addEventListener("click", () => {
    showLoadout = !showLoadout;
    localStorage.setItem("cmp-loadout", showLoadout ? "1" : "0");
    syncToggle();
    renderCards();
  });
  document.getElementById("patch-filter").addEventListener("change", (e) => {
    patchFilter = e.target.value;
    renderCards();
  });
  const laneSel = document.getElementById("lane-method");
  laneSel.innerHTML = LANE_METHODS.map((m) => `<option value="${m.key}">${m.label}</option>`).join("");
  laneSel.value = laneWinMethod();
  laneSel.addEventListener("change", (e) => {
    localStorage.setItem("cp-lane-metric", e.target.value);
    renderLaneLegend();
    renderCards();
  });
  const gradeSel = document.getElementById("lane-grade");
  gradeSel.value = laneGradeMode();
  gradeSel.addEventListener("change", (e) => {
    localStorage.setItem("cp-lane-grade", e.target.value);
    renderLaneLegend();
    renderCards();
  });
  renderLaneLegend();
  syncToggle();
  await Promise.all([loadRunes(), loadDdragon()]);
  let data;
  try {
    data = await (await fetch(`api/matchups/comparison?my_champion=${encodeURIComponent(my)}`
      + `&opp_champion=${encodeURIComponent(opp)}`)).json();
  } catch (e) {
    document.getElementById("cards").innerHTML = "<p class='muted'>Failed to load comparison.</p>";
    return;
  }
  CMP_PLAYERS = data.players || [];
  LANE_BASELINE = data.lane_baseline || null;
  LANE_GOAL = data.lane_goal || null;
  renderLaneLegend();
  // populate the patch dropdown from the patches present across all players' games
  // sort numerically (major then minor) so 16.14 > 16.9, newest first
  const patches = [...new Set(CMP_PLAYERS.flatMap((p) => (p.recent || []).map(patchOf))
    .filter(Boolean))].sort((a, b) => {
      const [am, an] = a.split(".").map(Number), [bm, bn] = b.split(".").map(Number);
      return bm - am || bn - an;
    });
  document.getElementById("patch-filter").innerHTML = `<option value="">All</option>`
    + patches.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
  renderCards();
})();
</script>
</body>
</html>
